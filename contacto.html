<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Mueblería Hermanos Jota</title>
  <link rel="stylesheet" href="styles.css">
   <link rel="script" href="contacto.js">
</head>
<body>

  <!-- Header compartido con el contador de carrito -->
  <header class="header">
    <div class="logo">
      <h1>Hermanos Jota</h1>
    </div>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="contacto.html" class="active">Contacto</a>
    </nav>
    <div class="cart-icon">
      🛒 <span id="cart-counter">0</span>
    </div>
  </header>

  <main class="main-container">
    <section class="contact-section">
      <h2>Ponte en contacto con nosotros</h2>
      <p>Déjanos tu consulta y te responderemos a la brevedad.</p>

      <form id="contact-form" class="contact-form" novalidate>
        
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez">
          <small class="error-msg" id="error-nombre"></small>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" placeholder="Ej: juan@email.com">
          <small class="error-msg" id="error-email"></small>
        </div>

        <div class="form-group">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
          <small class="error-msg" id="error-mensaje"></small>
        </div>

        <button type="submit" id="btn-submit">Enviar Mensaje</button>
      </form>

      <!-- Mensaje de éxito que se mostrará dinámicamente -->
      <div id="success-message" class="success-message hidden">
        ✓ ¡Gracias por tu mensaje! Nos pondremos en contacto pronto.
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Mueblería Hermanos Jota. Todos los derechos reservados.</p>
  </footer>

  <script src="contacto.js"></script>
</body>
</html>
